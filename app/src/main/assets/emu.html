<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  #msg { color: #ccc; font: 14px sans-serif; padding: 12px; position: absolute; z-index: 1; }
</style>
</head>
<body>
<div id="msg">에뮬레이터 불러오는 중… (처음 한 번은 인터넷 연결 필요)</div>
<div id="game"></div>
<script>
  var q = new URLSearchParams(location.search);
  var CDN = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_player = '#game';
  window.EJS_core = q.get('core');
  window.EJS_gameUrl = q.get('game');
  window.EJS_gameName = q.get('name') || 'game';
  window.EJS_pathtodata = CDN;
  window.EJS_startOnLoaded = true;
  window.EJS_color = '#2d6cdf';
  window.EJS_language = 'ko-KR';
  window.EJS_ready = function () { document.getElementById('msg').style.display = 'none'; };
  window.EJS_onGameStart = function () { document.getElementById('msg').style.display = 'none'; };
  var s = document.createElement('script');
  s.src = CDN + 'loader.js';
  s.onerror = function () {
    document.getElementById('msg').textContent =
      '에뮬레이터를 불러오지 못했습니다. 인터넷 연결을 확인하세요.';
  };
  document.body.appendChild(s);
</script>
</body>
</html>
