<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #dos { width: 100%; height: 100%; }
  #msg { color: #ccc; font: 13px/1.5 sans-serif; padding: 10px; position: absolute;
         z-index: 10; white-space: pre-wrap; pointer-events: none; }
</style>
</head>
<body>
<div id="msg">js-dos 불러오는 중… (처음 한 번은 인터넷 연결 필요)</div>
<div id="dos"></div>
<script>
  var msg = document.getElementById('msg');
  function show(t) { msg.style.display = 'block'; msg.textContent = t; }
  window.addEventListener('error', function (e) { show('오류: ' + e.message); });
  window.addEventListener('unhandledrejection', function (e) {
    show('오류: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  window.addEventListener('load', function () {
    if (typeof Dos === 'undefined') {
      show('js-dos를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
      return;
    }
    try {
      Dos(document.getElementById('dos'), {
        url: '/run.jsdos',
        autoStart: true,
        noCloud: true
      });
      setTimeout(function () { msg.style.display = 'none'; }, 4000);
    } catch (err) {
      show('실행 오류: ' + err);
    }
  });
</script>
</body>
</html>
