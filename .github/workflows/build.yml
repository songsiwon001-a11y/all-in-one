name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # js-dos(DOS 에뮬레이터)를 npm에서 받아 앱 안에 넣는다. (폰에서 외부 서버가 필요 없어짐)
      - name: Bundle js-dos into the app
        shell: bash
        run: |
          set -e
          mkdir -p jsdos_pkg
          npm install js-dos@8 --prefix jsdos_pkg --no-audit --no-fund
          DEST=app/src/main/assets/jsdos
          mkdir -p "$DEST/emulators"
          cp -r jsdos_pkg/node_modules/js-dos/dist/. "$DEST/"
          cp -r jsdos_pkg/node_modules/emulators/dist/. "$DEST/emulators/"
          find "$DEST" -name '*.map' -delete
          echo "--- js-dos files ---"
          ls -la "$DEST"
          echo "--- emulators files ---"
          ls -la "$DEST/emulators"
          du -sh "$DEST"
          test -f "$DEST/js-dos.js"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -nE '^e: |What went wrong|Execution failed' -A3 build.log | head -60 || true

      - uses: actions/upload-artifact@v4
        with:
          name: AllInOne-debug-apk
          path: app/build/outputs/apk/debug/*.apk
